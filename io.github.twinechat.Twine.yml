id: io.github.twinechat.Twine
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: twine
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  # X11 (XWayland) so GNOME's window manager draws the native title bar.
  # Chromium can only draw its own frame on Wayland.
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  # Desktop notifications for new messages
  - --talk-name=org.freedesktop.Notifications
  # Saving received files and images
  - --filesystem=xdg-download

modules:
  # Unbranded Chromium snapshot build. Unlike branded Google Chrome, it still
  # honours --load-extension. Pinned to a revision near the 158 stable branch.
  - name: chromium
    buildsystem: simple
    build-commands:
      - rm -f chrome_sandbox chrome-wrapper
      - mkdir -p /app/chromium
      - cp -a . /app/chromium/
    sources:
      - type: archive
        url: https://storage.googleapis.com/chromium-browser-snapshots/Linux_x64/1727463/chrome-linux.zip
        sha256: df307e304dd6ab9288ab32459b0b5979f690ca50bcf9c7a879e818e6d1e8f441

  # The LINE extension, downloaded from the Chrome Web Store update service
  # at build time (it is not redistributed in this repository).
  - name: line
    buildsystem: simple
    build-commands:
      # Twine's icon replaces LINE's as the extension icon (context menu).
      - for size in 16 32 48 128; do rsvg-convert -w $size -h $size ${FLATPAK_ID}.svg -o bootstrap/twine-icon-$size.png; done
      - python3 -I crx_unpack.py --overlay bootstrap --service-worker twine-bg.js --inject index.html=twine-title.js --add-permission contextMenus --add-permission nativeMessaging --add-permission debugger --add-permission tabs --icon 16=twine-icon-16.png --icon 32=twine-icon-32.png --icon 48=twine-icon-48.png --icon 128=twine-icon-128.png line.crx /app/share/line-extension ophjlpahpchlmihnnnihgmmeilfjmjjc
      - install -Dm755 twine.sh /app/bin/twine
      - install -Dm755 twine-prefs.py /app/libexec/twine-prefs.py
      - install -Dm755 twine-settings-host.py /app/libexec/twine-settings-host
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 ${FLATPAK_ID}.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 splash.html ${FLATPAK_ID}.svg -t /app/share/twine/
    sources:
      - type: file
        url: https://clients2.google.com/service/update2/crx?response=redirect&prodversion=158.0&acceptformat=crx3&x=id%3Dophjlpahpchlmihnnnihgmmeilfjmjjc%26uc
        dest-filename: line.crx
        sha256: 3722ab02edb0aba49c229399ee8df5b4b5a38c60b76efadadfbae395015eb859
      - type: file
        path: tools/crx_unpack.py
      - type: file
        path: data/twine.sh
      - type: file
        path: data/twine-prefs.py
      - type: file
        path: data/twine-settings-host.py
      - type: file
        path: data/splash.html
      - type: dir
        path: data/bootstrap
        dest: bootstrap
      - type: file
        path: data/io.github.twinechat.Twine.desktop
      - type: file
        path: data/io.github.twinechat.Twine.metainfo.xml
      - type: file
        path: data/io.github.twinechat.Twine.svg
